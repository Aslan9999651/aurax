services:
  # ===== Backend (FastAPI) =====
  - type: web
    name: aurax-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL        # سلسلة اتصال Supabase (Session pooler) مع كلمة المرور
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMERGENT_EMAIL_KEY  # مفتاح البريد المُدار (اختياري للبريد)
        sync: false
      - key: EMAIL_FROM_NAME
        value: AuraX
      - key: CORS_ORIGINS
        value: "*"

  # ===== Frontend (React static site) =====
  - type: web
    name: aurax-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: yarn install && yarn build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL   # ضع رابط aurax-backend بعد نشره
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
